<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>School Communication & Alert System</title>

<link rel="stylesheet"
href="css/style.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="background"></div>

<div class="login-container">

<div class="login-card">

<div class="school-logo">

<img src="https://srnmehtaschool.com/wp-content/uploads/2024/03/logo-e1725100967608.jpg"
alt="School Logo">

</div>

<h1>

School Communication

</h1>

<h2>

& Alert System

</h2>

<p class="welcome">

Welcome Back

</p>

<div class="input-group">

<label>

<i class="fa fa-user"></i>

User ID

</label>

<input
type="text"
id="userid"
placeholder="Enter User ID">

</div>

<div class="input-group">

<label>

<i class="fa fa-lock"></i>

Password

</label>

<input
type="password"
id="password"
placeholder="Enter Password">

</div>

<div class="input-group">

<label>

<i class="fa fa-users"></i>

Role

</label>


</div>

<button
id="loginBtn">

LOGIN

</button>

<div class="footer">

© 2026

School Communication & Alert System

</div>

</div>

</div>

<script src="js/auth.js"></script>

</body>

</html>
